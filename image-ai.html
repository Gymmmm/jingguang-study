<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圣经影像 AI · 经光</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;color:#23312b;background:#f5f2e9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:18px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 22px}a{color:#28624f;text-decoration:none}h1{font-size:25px;margin:8px 0}p{line-height:1.7;color:#617069}.panel{background:white;border:1px solid #e5e7df;border-radius:18px;padding:18px;margin:14px 0}textarea,input{font:inherit;width:100%;padding:12px;border:1px solid #d8ddd6;border-radius:10px;background:#fff}textarea{min-height:95px;resize:vertical}button{font:inherit;border:0;border-radius:10px;background:#28624f;color:white;padding:12px 17px;cursor:pointer}button.secondary{background:#e9f0e9;color:#275b49}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.muted{font-size:13px;color:#748078}.preview{max-height:320px;max-width:100%;object-fit:contain;border-radius:12px;display:none;margin:12px auto}.result{white-space:pre-wrap;line-height:1.8;background:#f6f7f3;border-radius:12px;padding:14px}.refs a{display:block;padding:8px 0;border-bottom:1px solid #edf0eb}label{display:block;font-weight:600;margin-bottom:8px}</style></head><body><div class="wrap"><header><a href="/">← 返回经光研经</a><span class="muted">私人创作入口 · 第一阶段</span></header><h1>圣经影像 AI</h1><p>上传参考图片、描述圣经场景，先查考资料，再准备生成或修改。图片生成与视频 API 尚待配置，当前不会虚报已生成作品。</p>
<section class="panel"><label for="image">参考图片（可选）</label><input id="image" type="file" accept="image/*"><img id="preview" class="preview" alt="参考图片预览"><p class="muted">原图仅在本机预览，当前不会上传服务器。</p><label for="scene">你想制作什么场景？</label><textarea id="scene" placeholder="例如：摩西时代的会幕外院，五根黄金方柱，按出埃及记制作"></textarea><div class="actions"><button id="study">查考场景</button><button id="plan" class="secondary">生成制作说明</button><button id="flow" class="secondary">视频动作说明</button></div></section>
<section class="panel"><h2>经文与怀著资料</h2><div id="refs" class="refs muted">输入场景后点击“查考场景”。</div></section>
<section class="panel"><h2>创作工作台</h2><div id="result" class="result">等待输入场景。</div><div class="actions"><button id="copy" class="secondary">复制说明</button></div></section><section class="panel"><h2>AI 创作</h2><p class="muted">需配置 AI_ACCESS_CODE、OPENAI_API_KEY；视频还需 GEMINI_API_KEY。API 请求可能收费。</p><label for="access">私人访问密码</label><input id="access" type="password" autocomplete="off" placeholder="私人访问密码"><div class="actions"><button id="analyze">AI 识别与查经</button><button id="generate">AI 生成图片</button><button id="edit" class="secondary">AI 修改原图</button><button id="video" class="secondary">图片生成视频</button></div><p class="muted" id="ai-status">尚未发起模型请求</p><img id="ai-output" class="preview" alt="AI 生成结果"><div id="video-result"></div><div class="actions"><button id="save-image" class="secondary">保存生成图片</button><button id="check-video" class="secondary">查看视频进度</button></div></section></div>
<script>
const $=id=>document.getElementById(id);let bible=[],egw=[],relations=[];
$('image').addEventListener('change',()=>{const f=$('image').files[0];if(!f)return;const img=$('preview');img.src=URL.createObjectURL(f);img.style.display='block'});
async function load(){for(const [name,set] of [['/data/egw-index.json',v=>egw=Array.isArray(v)?v:(v.entries||v.records||[])],['/data/bible-egw-relations.json',v=>relations=Array.isArray(v)?v:(v.relations||[])]]){try{const r=await fetch(name);if(r.ok)set(await r.json())}catch{}}}load();
function terms(s){return [...new Set((s.match(/[\u4e00-\u9fa5]{2,5}/g)||[]).flatMap(x=>[x,...(x.length>3?[x.slice(0,2),x.slice(-2)]:[])]))].filter(x=>!['制作','图片','按照','这个','重新','一张','帮我'].includes(x)).slice(0,12)}
function matches(row,t){const s=JSON.stringify(row).toLowerCase();return t.some(w=>s.includes(w.toLowerCase()))}
function refText(){const s=$('scene').value.trim();if(!s){$('refs').textContent='请先描述圣经场景。';return false}const t=terms(s);const items=egw.filter(x=>matches(x,t)).slice(0,8);const rel=relations.filter(x=>matches(x,t)).slice(0,6);const box=$('refs');box.replaceChildren();const heading=document.createElement('p');heading.textContent='相关主题资料（关键词匹配，仅供查考，非 AI 场景识别）：';box.append(heading);for(const r of rel){const p=document.createElement('div');p.textContent='相关经文：'+(r.bible_ref||'')+' · '+(r.themes||[]).join('、');box.append(p)}for(const x of items){const a=document.createElement('a');a.textContent=[x.title_cn||x.title,x.chapter,x.locator].filter(Boolean).join(' · ');a.href=x.source_url||'https://m.egwwritings.org/zh';a.target='_blank';a.rel='noopener noreferrer';box.append(a)}const a=document.createElement('a');a.href='https://m.egwwritings.org/zh/search?query='+encodeURIComponent(s);a.target='_blank';a.rel='noopener noreferrer';a.textContent='到预言之灵官方继续查考 ↗';box.append(a);if(!items.length&&!rel.length){const p=document.createElement('p');p.textContent='本地索引暂无明显匹配，请使用官方检索核实。';box.append(p)}return true}
$('study').onclick=()=>{if(refText())$('result').textContent='已列出关键词相关资料。请逐条核对原文与出处；当前版本尚不具备自动理解上传图片的视觉模型。'};
$('plan').onclick=()=>{if(!refText())return;const s=$('scene').value.trim();$('result').textContent='圣经历史图像制作说明（待核对）\n\n场景：'+s+'\n\n先查证对应圣经章节，明确人物、建筑、器物、数量、位置和尺寸。区分经文明确事实、历史复原与艺术表现。\n\n画面：9:16竖版，写实电影质感，古代中东环境，庄严自然，无现代物品、无多余文字。\n\n若上传原图，优先保留已确认的部分；基础结构错误则重做。生成后逐项检查数量、比例、位置和颜色。\n\n注意：此为制作说明，未调用图像生成 API。'};
$('flow').onclick=()=>{if(!refText())return;$('result').textContent='Google Flow 图片转视频说明\n\n以用户确认的原始图片为唯一视觉参考。画面中的人物、建筑、器物、数量、颜色、布局保持一致。摄影机缓慢、稳定地向前推进，轻微自然环境运动，不添加或删除物体。9:16竖版，写实、庄严、电影感。\n\n此处仅准备提示词，未调用视频生成 API。'};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('result').textContent);$('copy').textContent='已复制'}catch{$('copy').textContent='请长按文字复制'}};
</script><script>
let activeImage='',lastOperation='',lastAnalysis='';
const status=s=>$('ai-status').textContent=s;
async function compressed(file){if(!file)return '';const img=await createImageBitmap(file);const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);img.close();return c.toDataURL('image/jpeg',.78)}
async function sourceImage(){return activeImage||await compressed($('image').files[0])}
async function call(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','x-ai-access-code':$('access').value},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error||'请求失败');return j}
function selectedSources(){const t=terms($('scene').value);return egw.filter(x=>matches(x,t)).slice(0,6).map(x=>({title:x.title_cn||x.title,chapter:x.chapter,locator:x.locator,summary:x.summary,source_url:x.source_url}))}
async function runAI(kind){if(!refText())return;if(!$('access').value){status('请输入私人访问密码');return}const b=['analyze','generate','edit','video'].map(x=>$(x));b.forEach(x=>x.disabled=true);status('正在调用 AI，请稍候……');try{const scene=$('scene').value.trim(),image=await sourceImage();if(kind==='analyze'){const j=await call('/api/ai-scene',{scene,image,sources:selectedSources()});lastAnalysis=j.text;$('result').textContent=j.text;status('分析完成，请检查经文依据和生成提示词')}else if(kind==='generate'||kind==='edit'){const prompt=lastAnalysis?scene+'\n参考已核对的制作说明：\n'+lastAnalysis:scene;const j=await call('/api/ai-image',{prompt,image,mode:kind==='edit'?'edit':'generate'});activeImage=j.image;const out=$('ai-output');out.src=j.image;out.style.display='block';status('图片已生成，请核对柱子数量、比例和经文要求')}else{if(!image)throw Error('请先上传参考图片或生成图片');const prompt='Cinematic photorealistic biblical historical scene, vertical 9:16. Preserve all original objects, architecture, proportions, colors, pillars and arrangement exactly. Gentle slow camera push-in, natural subtle ambient motion. No new objects. '+scene;const j=await call('/api/ai-video',{prompt,image});lastOperation=j.operation;status('视频任务已提交。稍后点击“查看视频进度”。')}}catch(e){status('请求未完成：'+e.message)}finally{b.forEach(x=>x.disabled=false)}}
$('analyze').onclick=()=>runAI('analyze');$('generate').onclick=()=>runAI('generate');$('edit').onclick=()=>runAI('edit');$('video').onclick=()=>runAI('video');
$('save-image').onclick=()=>{if(!activeImage){status('尚无生成图片');return}const a=document.createElement('a');a.href=activeImage;a.download='jingguang-bible-image.png';a.click()};
$('check-video').onclick=async()=>{if(!lastOperation){status('尚无视频任务');return}try{const r=await fetch('/api/ai-video-status?operation='+encodeURIComponent(lastOperation),{headers:{'x-ai-access-code':$('access').value}});const j=await r.json();if(!r.ok)throw Error(j.detail||j.error);status(j.error||(!j.done?'视频仍在生成中':'视频任务已结束'));const box=$('video-result');box.replaceChildren();if(j.videoUrl){const a=document.createElement('a');a.href=j.videoUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='打开生成的视频';box.append(a)}}catch(e){status('查询失败：'+e.message)}};
</script></body></html>
