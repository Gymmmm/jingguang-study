name: Jingguang Bible Source

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ensure-bible-engine.mjs'
      - 'scripts/validate-bible.mjs'
      - 'data/bible-source.json'
      - 'data/bible-books.json'
      - 'index.html'
      - '.github/workflows/import-bible.yml'
  pull_request:
    paths:
      - 'scripts/ensure-bible-engine.mjs'
      - 'scripts/validate-bible.mjs'
      - 'data/bible-source.json'
      - 'data/bible-books.json'
      - 'index.html'
      - '.github/workflows/import-bible.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bible-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate complete 66-book Chinese Bible source
        run: node scripts/validate-bible.mjs
      - name: Verify native Bible integration
        run: node scripts/ensure-bible-engine.mjs
