<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>救赎的历史｜圣经与预言之灵研经</title><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1"><link rel="icon" type="image/png" href="/apple-touch-icon.png?v=1"><link rel="stylesheet" href="./styles.css?v=2"><link rel="stylesheet" href="./reader.css?v=7"><link rel="stylesheet" href="./egw-reader-polish.css?v=1"><link rel="stylesheet" href="./egw-toc-polish.css?v=2"></head><body>
<div class="app"><header><button data-page="home" class="logo">救赎的历史</button><div class="headerTools"><small id="status">资料加载中…</small><label class="themePicker"><span>背景</span><select id="themeSelect" aria-label="选择阅读背景"><option value="paper">暖白</option><option value="sepia">米黄</option><option value="green">柔绿</option><option value="dark">深色</option></select></label></div></header><nav><button class="active" data-page="home">首页</button><button data-open-shelf="bible">圣经</button><button data-open-shelf="egw">怀爱伦</button><button data-page="favorites">收藏</button></nav><main>
<section id="home" class="page active"><form data-search class="homeSearch"><input name="q" aria-label="搜索经文、主题或书目" placeholder="搜索：摩西、安息日、约3:16…"><button>搜索</button></form><h2>最近看过</h2><div id="recentReading"></div><div id="favoritePreview" hidden aria-hidden="true"></div></section>
<section id="study" class="page searchPage"><header class="searchPageHead"><button data-page="home">‹ 返回</button><h1>搜索</h1></header><form data-search class="searchPageForm"><input id="studyQ" name="q" aria-label="搜索经文、主题或书目" placeholder="搜索经文、主题或书名"><button class="primary">搜索</button></form><div class="tabs searchSourceTabs" aria-label="筛选搜索来源"><button class="active" data-filter="all">全部</button><button data-filter="bible">圣经</button><button data-filter="egw">怀爱伦</button></div><div id="studyResults" class="results searchResults"><div class="empty">输入关键词或经文，结果会按圣经和怀爱伦著作分开显示。</div></div></section>
<section id="library" class="page"><div id="bibleShelf"><h2>圣经 · 和合本简体</h2><input id="bibleBookSearch" placeholder="输入书名，例如：约翰福音、诗篇"><div id="bibleBooks"></div></div><div id="egwShelf" hidden><input id="egwBookSearch" aria-label="搜索怀爱伦书名" placeholder="搜索书名"><div id="egwBooks"></div></div></section>
<section id="projects" class="page"><h1>备讲工具</h1><div class="toolExplain"><b>它有什么用？</b><p>看到有用的经文或怀爱伦资料时，先放进材料篮；准备讲道时，再把这些材料加入一个讲章。只想阅读可以完全不用这里。</p><button data-page="basket">打开材料篮</button></div><h2>我的讲章</h2><form id="projectForm" class="form"><label>讲题<input id="projectTitle" required placeholder="例如：基督在天上圣所的工作"></label><label>听众<select id="audience"><option>普通信徒</option><option>初信者</option><option>慕道友</option><option>青年</option><option>儿童</option><option>查经班</option></select></label><label>时长<select id="duration"><option value="10">10分钟</option><option value="20">20分钟</option><option value="30">30分钟</option><option value="45">45分钟</option></select></label><button>新建讲章</button></form><div id="projectsList" class="results"></div></section>
<section id="favorites" class="page"><h1>我的收藏</h1><p>收藏的圣经章节和怀爱伦著作都在这里。</p><div id="favoritesList" class="results"></div></section>
<section id="basket" class="page"><h1>材料篮</h1><p>临时收集经文和可核验的怀著资料。</p><h2 id="basketCount"></h2><div id="basketResults" class="results"></div></section></main></div>
