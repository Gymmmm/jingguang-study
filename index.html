<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>经光｜圣经与预言之灵研经</title><link rel="stylesheet" href="./styles.css?v=1"></head><body>
<div class="app"><header><button data-page="home" class="logo">经光</button><small id="status">资料加载中…</small></header><main>
<section id="home" class="page active"><div class="hero"><b>圣经与预言之灵研经工作台</b><h1>从一段经文或一个主题开始</h1><p>先读中文和合本，再核对相关怀著出处，最后整理进讲章。</p><form data-search><input name="q" placeholder="例如：约3:16、但8:14、安息日、圣所"><button>开始研究</button></form><div class="chips"><button data-query="约3:16">约3:16</button><button data-query="但8:14">但8:14</button><button data-query="启14:6-12">启14:6-12</button><button data-query="安息日">安息日</button><button data-query="圣所">圣所</button></div></div><div class="shortcuts"><button data-page="study"><b>查一段经文</b><span>正文、上下文和相关怀著</span></button><button data-page="study"><b>研究一个主题</b><span>中文主题与圣经证据链</span></button><button data-page="projects"><b>继续备讲</b><span>回到现有讲章项目</span></button><button data-page="library"><b>查看资料库</b><span>查书名、主题和经文</span></button></div><h2>最近研究</h2><div id="recent"></div><h2>继续备讲</h2><div id="projectPreview"></div></section>
<section id="study" class="page"><h1>研究</h1><p>输入经文或中文主题，结果按来源分开显示。</p><form data-search><input id="studyQ" name="q" placeholder="输入经文或中文主题"><button>查询</button></form><div class="tabs"><button class="active" data-filter="all">全部</button><button data-filter="bible">经文</button><button data-filter="egw">怀著</button></div><div id="studyResults" class="results"><div class="empty">输入经文或主题开始研究。</div></div></section>
<section id="library" class="page"><h1>预言之灵资料库</h1><p>可核验的研究索引，不是怀著原文库。</p><form id="libraryForm"><input id="libraryQ" placeholder="搜索书名、中文主题或经文"><button>搜索</button></form><div class="tabs"><button class="active" data-lib="all">全部</button><button data-lib="book">按书名</button><button data-lib="topic">按主题</button><button data-lib="verse">按经文</button></div><h2 id="libraryCount"></h2><div id="libraryResults" class="results"></div></section>
<section id="projects" class="page"><h1>讲章</h1><p>把材料篮中的经文和怀著出处整理进讲章。</p><form id="projectForm" class="form"><label>讲题<input id="projectTitle" required placeholder="例如：基督在天上圣所的工作"></label><label>听众<select id="audience"><option>普通信徒</option><option>初信者</option><option>慕道友</option><option>青年</option><option>儿童</option><option>查经班</option></select></label><label>时长<select id="duration"><option value="10">10分钟</option><option value="20">20分钟</option><option value="30">30分钟</option><option value="45">45分钟</option></select></label><button>建立讲章</button></form><div id="projectsList" class="results"></div></section>
<section id="basket" class="page"><h1>材料篮</h1><p>临时收集经文和可核验的怀著资料。</p><h2 id="basketCount"></h2><div id="basketResults" class="results"></div></section></main>
<nav><button class="active" data-page="home">首页</button><button data-page="study">研究</button><button data-page="library">资料库</button><button data-page="projects">讲章</button><button data-page="basket">材料篮</button></nav></div>
<dialog id="detail"><header><button id="back">‹ 返回</button><small id="detailType"></small></header><div id="detailBody"></div><footer id="detailActions"></footer></dialog><div id="toast"></div><script src="./app.js?v=1" defer></script></body></html>
