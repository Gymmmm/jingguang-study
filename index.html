<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>经光 V10.2｜圣经 × 预言之灵研经工作台</title><meta name="theme-color" content="#08111f"><style>
:root{--bg:#07101d;--card:#101b2e;--line:#283a58;--text:#f4f7fb;--muted:#aab6ca;--gold:#d8b66c;--blue:#9dc4ff;--green:#9ad0aa;--red:#e6a6a6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101d,#0b1525 45%,#08111e);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:960px;margin:auto;padding:18px 15px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.logo{font-size:27px;font-weight:800;letter-spacing:.12em}.ver{font-size:11px;background:var(--gold);color:#17130c;padding:6px 9px;border-radius:999px;font-weight:800}.panel{display:none}.panel.active{display:block}.hero{background:linear-gradient(145deg,rgba(216,182,108,.18),rgba(16,27,46,.95));border:1px solid rgba(216,182,108,.28);border-radius:23px;padding:20px 17px}.hero h1{font-size:22px;margin:0 0 8px}.muted,.hero p{color:var(--muted);line-height:1.65}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1;min-width:0;background:#091424;border:1px solid var(--line);border-radius:14px;color:#fff;padding:14px;font-size:15px}.btn,.search button{border:0;border-radius:12px;background:var(--gold);color:#17130c;font-weight:800;padding:10px 13px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.chip{border:1px solid var(--line);background:#0d192b;color:#e8eef8;border-radius:999px;padding:8px 10px;font-size:12px}.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.section-head h2{font-size:17px;margin:0}.section-head span{font-size:11px;color:var(--muted)}.card,.result{background:rgba(16,27,46,.97);border:1px solid var(--line);border-radius:17px;padding:14px}.result{margin-top:10px}.card h3,.result h3{font-size:15px;margin:0 0 6px}.card p,.result p{font-size:13px;color:#d9e2ef;line-height:1.58;margin:0}.meta{font-size:11px;color:var(--gold);font-weight:800;margin-bottom:6px}.source{margin-top:8px;padding:9px 10px;background:#0b1627;border-left:3px solid var(--gold);border-radius:9px;font-size:12px;line-height:1.6}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{border:1px solid var(--line);background:#15243c;color:#fff;border-radius:10px;padding:8px 9px;font-size:11px}.actions .primary{background:var(--gold);border-color:var(--gold);color:#17130c;font-weight:800}.layer{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;margin-top:9px}.layer b{width:28px;height:28px;border-radius:9px;background:#17263e;display:grid;place-items:center;color:var(--gold)}.project{border-left:3px solid var(--green)}.basket{border-left:3px solid var(--blue)}.field{margin-top:10px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#091424;border:1px solid var(--line);border-radius:11px;color:#fff;padding:10px;font-size:13px}.field textarea{min-height:90px}.empty{color:var(--muted);font-size:13px;padding:15px 0}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10px;color:var(--muted);margin:3px 4px 0 0}.status{font-size:11px;color:var(--muted)}.status.ok{color:var(--green)}.status.bad{color:var(--red)}.verse{display:grid;grid-template-columns:32px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid rgba(40,58,88,.45)}.verse-num{color:var(--gold);font-size:12px;padding-top:5px}.verse-text{font-family:"Songti SC","STSong",serif;font-size:18px;line-height:1.85}.bottom{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(94%,820px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(10,18,31,.96);border:1px solid var(--line);border-radius:18px;padding:7px;backdrop-filter:blur(16px);z-index:30}.bottom button{border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:10px;font-size:11px}.bottom button.active{background:#17263e;color:#fff}.reader{display:none;position:fixed;inset:0;z-index:50;background:#07101d;overflow:auto}.reader-inner{max-width:780px;margin:auto;padding:14px 17px 80px}.readerbar{position:sticky;top:0;display:flex;justify-content:space-between;background:rgba(7,16,29,.96);padding:8px 0 12px}.readerbar button{border:1px solid var(--line);background:#101b2e;color:#fff;border-radius:10px;padding:8px 10px}.reading{font-family:"Songti SC","STSong",serif;font-size:18px;line-height:1.95}@media(min-width:720px){.app{padding-top:28px}}
</style></head><body><div class="app"><div class="top"><div class="logo">经光</div><div><span id="dataStatus" class="status">资料加载中…</span> <span class="ver">V10.2</span></div></div>
<section id="home" class="panel active"><div class="hero"><h1>查圣经，连接预言之灵原始资料</h1><p>完整中文和合本阅读作为第一层；预言之灵、我的研究、AI整理永远分层。</p><div class="search"><input id="homeQ" placeholder="例如：约3:16 / 但8:14 / 启14:6-12 / 安息日"><button onclick="runStudy('homeQ')">研究</button></div><div class="chips"><button class="chip" onclick="quick('约3:16')">约3:16</button><button class="chip" onclick="quick('但8:14')">但8:14</button><button class="chip" onclick="quick('启14:6-12')">启14:6-12</button><button class="chip" onclick="quick('安息日')">安息日</button><button class="chip" onclick="quick('圣所')">圣所</button></div></div><div class="section"><div class="section-head"><h2>研究层级</h2><span>来源永远分清</span></div><div id="sourceHierarchy" class="card"></div></div><div class="section"><div class="section-head"><h2>继续备讲</h2><span id="projectCount"></span></div><div id="projectHome"></div></div></section>
<section id="study" class="panel"><div class="hero"><h1>圣经 → 预言之灵</h1><p>输入经文时先读取和合本正文，再连接关系索引和怀著出处。</p><div class="search"><input id="studyQ" placeholder="约3:16 / 启14:6-12 / 圣所"><button onclick="runStudy('studyQ')">查</button></div></div><div id="studyResult" class="section"><div class="empty">输入经文开始。</div></div></section>
<section id="library" class="panel"><div class="section-head"><h2>预言之灵资料索引</h2><span id="libraryCount"></span></div><div class="hero"><h1>出处索引库</h1><p>每条保存书名、章节、定位、相关经文、主题和官方来源。</p></div><div id="libraryList" class="section"></div></section>
<section id="projects" class="panel"><div class="section-head"><h2>讲章项目</h2><span>长期保存 · 可继续</span></div><div class="card"><div class="field"><label>新讲章项目</label><input id="newProjectTitle" placeholder="例如：基督在天上圣所的工作"></div><div class="field"><label>听众</label><select id="newProjectAudience"><option>普通信徒</option><option>初信者</option><option>慕道友</option><option>青年</option><option>儿童</option><option>查经班</option></select></div><div class="field"><label>时长</label><select id="newProjectDuration"><option value="10">10分钟</option><option value="20">20分钟</option><option value="30" selected>30分钟</option><option value="45">45分钟</option></select></div><div class="actions"><button class="primary" onclick="createProject()">建立项目</button></div></div><div id="projectsList" class="section"></div></section>
<section id="basket" class="panel"><div class="section-head"><h2>讲章材料篮</h2><span id="basketCount"></span></div><div class="card"><p>材料保存来源快照和精确出处。</p></div><div id="basketList" class="section"></div></section></div>
<div id="reader" class="reader"><div class="reader-inner"><div class="readerbar"><button onclick="closeReader()">← 返回</button><button id="readerAction" onclick="addCurrent()">＋加入材料篮</button></div><div class="meta" id="rmeta"></div><h1 id="rtitle"></h1><div id="rbody" class="reading"></div><div id="rtools" class="section"></div></div></div>
<nav class="bottom"><button data-p="home" class="active" onclick="go('home')">首页</button><button data-p="study" onclick="go('study')">圣经→怀著</button><button data-p="library" onclick="go('library')">资料库</button><button data-p="projects" onclick="go('projects')">讲章</button><button data-p="basket" onclick="go('basket')">材料篮</button></nav>
<script>
let egw=[],relations=[],sermonSchema=null,bibleSource=null,bibleBooks=[],current=null;const bibleCache=new Map();
const fallbackHierarchy=[{level:1,label:'圣经',rule:'primary'},{level:2,label:'预言之灵原始资料',rule:'supporting_verified_source'},{level:3,label:'我的研究',rule:'user_authored'},{level:4,label:'AI整理',rule:'derived_only_never_quote_as_source'}];
const legacyIdMap={da29:'DA-29-SABBATH',ed29:'ED-29-SABBATH',cch47:'CCH-47-SABBATH','6t44':'6T-44-SABBATH',cihs:'CIHS-2300',ew:'EW-VISIONS',ev8:'EV-08-DISTINCTIVE'};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function norm(s){return String(s||'').trim().replace(/\s+/g,'').replace(/[：]/g,':').toLowerCase()}
async function loadData(){const st=document.getElementById('dataStatus');try{const urls=['./data/egw-index.json','./data/bible-egw-relations.json','./data/sermon-project-schema.json','./data/bible-source.json','./data/bible-books.json'];const rs=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'})));if(rs.some(r=>!r.ok))throw Error('data fetch failed');const [ej,rj,sj,bs,bm]=await Promise.all(rs.map(r=>r.json()));egw=ej.records||[];relations=rj.relations||[];sermonSchema=sj;bibleSource=bs;bibleBooks=bm.books||[];st.textContent=`圣经66卷 · 怀著 ${egw.length} · 关系 ${relations.length}`;st.className='status ok';migrateLegacy();renderHierarchy();renderProjectHome();renderBasket()}catch(e){console.error(e);st.textContent='资料加载失败';st.className='status bad';sermonSchema={source_hierarchy:fallbackHierarchy};renderHierarchy()}}
function renderHierarchy(){const rows=sermonSchema?.source_hierarchy||fallbackHierarchy;document.getElementById('sourceHierarchy').innerHTML=rows.map(x=>`<div class="layer"><b>${esc(x.level)}</b><div><strong>${esc(x.label)}</strong><p class="muted">${x.rule==='primary'?'圣经正文、上下文和相关经文。':x.rule==='supporting_verified_source'?'怀著精确出处与官方上下文。':x.rule==='user_authored'?'讲道人自己的研究笔记。':'只整理已核验资料，不冒充来源。'}</p></div></div>`).join('')}
function parseBibleRef(q){let n=norm(q);for(const [osis,full,short] of bibleBooks){for(const a of [full,short,osis]){const aa=norm(a);if(n.startsWith(aa)){let tail=n.slice(aa.length),m=tail.match(/^(\d+)(?::(\d+)(?:[-–](\d+))?)?$/);if(m)return{osis,full,short,chapter:+m[1],from:m[2]?+m[2]:null,to:m[3]?+m[3]:(m[2]?+m[2]:null)}}}}return null}
async function loadBibleBook(osis){if(bibleCache.has(osis))return bibleCache.get(osis);const cfg=bibleSource?.translations?.[bibleSource.default_translation];if(!cfg)throw Error('Bible source missing');const r=await fetch(cfg.base_url+osis+'.json');if(!r.ok)throw Error('Bible book fetch '+r.status);const j=await r.json();bibleCache.set(osis,j);return j}
function chapterFromBook(book,n){if(Array.isArray(book.chapters)){const c=book.chapters[n-1];return c?.verses||c||[]}return []}
async function biblePassage(ref){if(!ref)return null;const book=await loadBibleBook(ref.osis),verses=chapterFromBook(book,ref.chapter);let selected=verses;if(ref.from)selected=verses.filter(v=>Number(v.number??v.verse)>=ref.from&&Number(v.number??v.verse)<=ref.to);return{...ref,verses:selected}}
function relationFor(q){const n=norm(q);return relations.find(x=>[x.bible_ref,x.normalized,...(x.themes||[])].some(v=>v&&(n.includes(norm(v))||norm(v).includes(n))))||null}
function relatedEGW(q,rel){const ids=new Set(rel?.egw_ids||[]),terms=[q,...(rel?.themes||[]),...(rel?.related_bible||[])].map(norm);return egw.filter(e=>ids.has(e.id)||terms.some(t=>t&&[e.title_cn,e.title,e.book_code,e.chapter,e.locator,...(e.bible_refs||[]),...(e.topics||[])].map(norm).some(h=>h.includes(t)||t.includes(h))))}
function go(p){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));if(p==='library')renderLibrary();if(p==='projects')renderProjects();if(p==='basket')renderBasket()}function quick(q){homeQ.value=q;runStudy('homeQ')}
async function runStudy(id){const q=document.getElementById(id).value.trim();if(!q)return;go('study');studyQ.value=q;studyResult.innerHTML='<div class="empty">正在读取圣经与资料索引…</div>';const ref=parseBibleRef(q),rel=relationFor(q),hits=relatedEGW(q,rel);let h='';if(ref){try{const p=await biblePassage(ref);h+=`<div class="card"><div class="meta">第一层 · 圣经 · 和合本简体</div><h3>${esc(ref.full)} ${ref.chapter}${ref.from?':'+ref.from+(ref.to!==ref.from?'–'+ref.to:''):''}</h3>${p.verses.map(v=>`<div class="verse"><div class="verse-num">${esc(v.number??v.verse)}</div><div class="verse-text">${esc(v.text)}</div></div>`).join('')}<div class="actions"><button onclick="openBible('${ref.osis}',${ref.chapter})">阅读整章</button></div></div>`}catch(e){h+=`<div class="card"><div class="meta">第一层 · 圣经</div><p>正文暂时读取失败，但仍继续查询本地关系索引。</p></div>`}}else if(rel)h+=`<div class="card"><div class="meta">第一层 · 圣经关系索引</div><h3>${esc(rel.bible_ref)}</h3></div>`;else h+=`<div class="card"><div class="meta">研究主题</div><h3>${esc(q)}</h3></div>`;if(rel)h+=`<div class="source"><b>相关经文</b><br>${(rel.related_bible||[]).map(esc).join(' · ')||'暂无'}</div>`;h+=`<div class="section-head" style="margin-top:18px"><h2>预言之灵相关资料</h2><span>${hits.length} 条</span></div>`;if(!hits.length)h+='<div class="empty">当前怀著索引暂无精确结果；不会用 AI 猜测冒充原文。</div>';hits.forEach(e=>h+=egwCard(e));studyResult.innerHTML=h}
async function openBible(osis,chapter){const b=bibleBooks.find(x=>x[0]===osis);try{const p=await biblePassage({osis,full:b?.[1]||osis,short:b?.[2]||'',chapter,from:null,to:null});current=null;readerAction.style.display='none';rmeta.textContent='第一层 · 圣经 · 和合本简体';rtitle.textContent=`${p.full} ${chapter}章`;rbody.innerHTML=p.verses.map(v=>`<div class="verse"><div class="verse-num">${esc(v.number??v.verse)}</div><div class="verse-text">${esc(v.text)}</div></div>`).join('');rtools.innerHTML='';reader.style.display='block'}catch(e){alert('这一章暂时读取失败')}}
function egwCard(e){return `<div class="result"><div class="meta">第二层 · 预言之灵原始资料定位</div><h3>《${esc(e.title_cn||e.title)}》 · ${esc(e.chapter||'')}</h3><div class="source"><b>${esc(e.book_code||'')} · ${esc(e.locator||'')}</b><br>相关经文：${(e.bible_refs||[]).map(esc).join(' · ')}</div><p style="margin-top:9px"><b>经光研究摘要：</b>${esc(String(e.summary||'').replace('研究摘要：',''))}</p><div class="actions"><button class="primary" onclick="openEGW('${esc(e.id)}')">查看出处</button><button onclick="addBasket('${esc(e.id)}')">＋材料篮</button></div></div>`}
function openEGW(id){const e=egw.find(x=>x.id===id);if(!e)return;current=e;readerAction.style.display='block';rmeta.textContent=`预言之灵 · ${e.book_code||''} · ${e.locator||''}`;rtitle.textContent=`《${e.title_cn||e.title}》 ${e.chapter||''}`;rbody.innerHTML=`<p>${esc(e.summary||'')}</p><p><b>涉及经文</b><br>${(e.bible_refs||[]).map(esc).join(' · ')}</p>`;rtools.innerHTML=`<div class="card"><div class="actions"><button class="primary" onclick="window.open('${esc(e.source_url||'')}','_blank')">阅读官方原始上下文 ↗</button></div></div>`;reader.style.display='block'}function closeReader(){reader.style.display='none'}function addCurrent(){if(current)addBasket(current.id)}
function getBasket(){try{return JSON.parse(localStorage.getItem('jg_v10_basket')||'[]')}catch{return[]}}function migrateLegacy(){localStorage.setItem('jg_v10_basket',JSON.stringify([...new Set(getBasket().map(x=>legacyIdMap[x]||x))]))}function addBasket(id){let a=getBasket();if(!a.includes(id))a.push(id);localStorage.setItem('jg_v10_basket',JSON.stringify(a));renderBasket();alert('已加入材料篮')}function removeBasket(id){localStorage.setItem('jg_v10_basket',JSON.stringify(getBasket().filter(x=>x!==id)));renderBasket()}
function renderBasket(){const es=getBasket().map(id=>egw.find(x=>x.id===id)).filter(Boolean);basketCount.textContent=`${es.length} 条`;basketList.innerHTML=es.length?es.map(e=>`<div class="result basket"><div class="meta">${esc(e.book_code)} · ${esc(e.locator)}</div><h3>《${esc(e.title_cn||e.title)}》</h3><div class="actions"><button onclick="openEGW('${esc(e.id)}')">核对出处</button><button onclick="removeBasket('${esc(e.id)}')">移除</button></div></div>`).join(''):'<div class="empty">材料篮还是空的。</div>'}
function getProjects(){try{return JSON.parse(localStorage.getItem('jg_v10_projects')||'[]')}catch{return[]}}function saveProjects(a){localStorage.setItem('jg_v10_projects',JSON.stringify(a));renderProjects();renderProjectHome()}function normalizeProject(p){p.status=p.status==='研究中'?'researching':(p.status||'researching');p.research_notes=p.research_notes??p.notes??'';p.materials=p.materials||[];p.audience=p.audience||'普通信徒';p.duration_minutes=Number(p.duration_minutes||30);p.updated_at=p.updated_at||new Date(p.updated||Date.now()).toISOString();return p}function snapshotMaterial(id){const e=egw.find(x=>x.id===id);return e?{id:`mat-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,type:'egw',source_id:e.id,label:`《${e.title_cn||e.title}》 ${e.chapter||''}`,locator:e.locator||null,verified:false,note:'',source_url:e.source_url||'',bible_refs:e.bible_refs||[]}:null}
function createProject(){const t=newProjectTitle.value.trim();if(!t)return;const now=new Date().toISOString(),a=getProjects();a.unshift({id:`sermon-${Date.now()}`,title:t,status:'researching',audience:newProjectAudience.value,duration_minutes:+newProjectDuration.value,core_bible_refs:[],materials:[],outline:[],application:'',appeal:'',research_notes:'',created_at:now,updated_at:now});saveProjects(a);newProjectTitle.value=''}function statusLabel(s){return({researching:'研究中',outlining:'整理结构',ready:'可讲',archived:'已归档'})[s]||s}
function renderProjects(){const a=getProjects().map(normalizeProject);projectsList.innerHTML=a.length?a.map(p=>`<div class="result project"><div class="meta">${statusLabel(p.status)} · ${new Date(p.updated_at).toLocaleDateString()}</div><h3>${esc(p.title)}</h3><p>${esc(p.audience)} · ${p.duration_minutes}分钟 · 材料 ${p.materials.length} 条</p><div class="field"><label>我的研究笔记</label><textarea onchange="updateProject('${p.id}',this.value)">${esc(p.research_notes)}</textarea></div><div class="actions"><button onclick="attachBasket('${p.id}')">把材料篮加入项目</button><button onclick="deleteProject('${p.id}')">删除</button></div></div>`).join(''):'<div class="empty">还没有讲章项目。</div>'}function updateProject(id,v){let a=getProjects().map(normalizeProject),p=a.find(x=>String(x.id)===String(id));if(!p)return;p.research_notes=v;p.updated_at=new Date().toISOString();saveProjects(a)}function attachBasket(id){let a=getProjects().map(normalizeProject),p=a.find(x=>String(x.id)===String(id));if(!p)return;let seen=new Set(p.materials.map(m=>m.source_id));getBasket().forEach(x=>{if(!seen.has(x)){let m=snapshotMaterial(x);if(m)p.materials.push(m)}});p.updated_at=new Date().toISOString();saveProjects(a)}function deleteProject(id){saveProjects(getProjects().filter(x=>String(x.id)!==String(id))}function renderProjectHome(){const a=getProjects().map(normalizeProject);projectCount.textContent=`${a.length} 个项目`;projectHome.innerHTML=a.length?a.slice(0,3).map(p=>`<div class="result project"><div class="meta">${statusLabel(p.status)}</div><h3>${esc(p.title)}</h3><p>${p.materials.length} 条材料 · ${p.research_notes?'已有研究笔记':'尚未写笔记'}</p><div class="actions"><button onclick="go('projects')">继续备讲</button></div></div>`).join(''):'<div class="card"><p>建立第一个讲章项目后，会在这里继续。</p><div class="actions"><button onclick="go('projects')">建立讲章项目</button></div></div>'}function renderLibrary(){libraryCount.textContent=`${egw.length} 条`;libraryList.innerHTML=egw.map(egwCard).join('')}
loadData();
</script><script src="./bible-engine.js"></script></body></html>
