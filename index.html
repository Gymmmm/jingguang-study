<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>经光 V10.1｜圣经 × 预言之灵研经工作台</title><meta name="theme-color" content="#08111f"><style>
:root{--bg:#07101d;--card:#101b2e;--line:#283a58;--text:#f4f7fb;--muted:#aab6ca;--gold:#d8b66c;--blue:#9dc4ff;--green:#9ad0aa;--red:#e6a6a6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101d,#0b1525 45%,#08111e);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:960px;margin:auto;padding:18px 15px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.logo{font-size:27px;font-weight:800;letter-spacing:.12em}.ver{font-size:11px;background:var(--gold);color:#17130c;padding:6px 9px;border-radius:999px;font-weight:800}.panel{display:none}.panel.active{display:block}.hero{background:linear-gradient(145deg,rgba(216,182,108,.18),rgba(16,27,46,.95));border:1px solid rgba(216,182,108,.28);border-radius:23px;padding:20px 17px}.hero h1{font-size:22px;margin:0 0 8px}.muted,.hero p{color:var(--muted);line-height:1.65}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1;min-width:0;background:#091424;border:1px solid var(--line);border-radius:14px;color:#fff;padding:14px;font-size:15px}.btn,.search button{border:0;border-radius:12px;background:var(--gold);color:#17130c;font-weight:800;padding:10px 13px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.chip{border:1px solid var(--line);background:#0d192b;color:#e8eef8;border-radius:999px;padding:8px 10px;font-size:12px}.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.section-head h2{font-size:17px;margin:0}.section-head span{font-size:11px;color:var(--muted)}.card,.result{background:rgba(16,27,46,.97);border:1px solid var(--line);border-radius:17px;padding:14px}.result{margin-top:10px}.card h3,.result h3{font-size:15px;margin:0 0 6px}.card p,.result p{font-size:13px;color:#d9e2ef;line-height:1.58;margin:0}.meta{font-size:11px;color:var(--gold);font-weight:800;margin-bottom:6px}.source{margin-top:8px;padding:9px 10px;background:#0b1627;border-left:3px solid var(--gold);border-radius:9px;font-size:12px;line-height:1.6}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{border:1px solid var(--line);background:#15243c;color:#fff;border-radius:10px;padding:8px 9px;font-size:11px}.actions .primary{background:var(--gold);border-color:var(--gold);color:#17130c;font-weight:800}.layer{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;margin-top:9px}.layer b{width:28px;height:28px;border-radius:9px;background:#17263e;display:grid;place-items:center;color:var(--gold)}.project{border-left:3px solid var(--green)}.basket{border-left:3px solid var(--blue)}.field{margin-top:10px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#091424;border:1px solid var(--line);border-radius:11px;color:#fff;padding:10px;font-size:13px}.field textarea{min-height:90px}.empty{color:var(--muted);font-size:13px;padding:15px 0}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10px;color:var(--muted);margin:3px 4px 0 0}.status{font-size:11px;color:var(--muted)}.status.ok{color:var(--green)}.status.bad{color:var(--red)}.bottom{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(94%,820px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(10,18,31,.96);border:1px solid var(--line);border-radius:18px;padding:7px;backdrop-filter:blur(16px);z-index:30}.bottom button{border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:10px;font-size:11px}.bottom button.active{background:#17263e;color:#fff}.reader{display:none;position:fixed;inset:0;z-index:50;background:#07101d;overflow:auto}.reader-inner{max-width:780px;margin:auto;padding:14px 17px 80px}.readerbar{position:sticky;top:0;display:flex;justify-content:space-between;background:rgba(7,16,29,.96);padding:8px 0 12px}.readerbar button{border:1px solid var(--line);background:#101b2e;color:#fff;border-radius:10px;padding:8px 10px}.reading{font-family:"Songti SC","STSong",serif;font-size:18px;line-height:1.95}@media(min-width:720px){.app{padding-top:28px}}
</style></head><body><div class="app"><div class="top"><div class="logo">经光</div><div><span id="dataStatus" class="status">资料加载中…</span> <span class="ver">V10.1</span></div></div>
<section id="home" class="panel active"><div class="hero"><h1>查一节圣经，找到预言之灵原始资料</h1><p>圣经为主线。找出处、读上下文、核对，再决定是否加入讲章。</p><div class="search"><input id="homeQ" placeholder="例如：但8:14 / 启14:6-12 / 安息日"><button onclick="runStudy('homeQ')">研究</button></div><div class="chips"><button class="chip" onclick="quick('但8:14')">但8:14</button><button class="chip" onclick="quick('启14:6-12')">启14:6-12</button><button class="chip" onclick="quick('创2:1-3')">创2:1-3</button><button class="chip" onclick="quick('安息日')">安息日</button><button class="chip" onclick="quick('圣所')">圣所</button></div></div><div class="section"><div class="section-head"><h2>研究层级</h2><span>来源永远分清</span></div><div id="sourceHierarchy" class="card"></div></div><div class="section"><div class="section-head"><h2>继续备讲</h2><span id="projectCount"></span></div><div id="projectHome"></div></div></section>
<section id="study" class="panel"><div class="hero"><h1>圣经 → 预言之灵</h1><p>按经文、主题、书名或出处查。结果优先显示精确定位，不先显示 AI 摘要。</p><div class="search"><input id="studyQ" placeholder="启14:6-12 / Rev 14:6-12 / 圣所"><button onclick="runStudy('studyQ')">查</button></div></div><div id="studyResult" class="section"><div class="empty">输入经文开始。</div></div></section>
<section id="library" class="panel"><div class="section-head"><h2>预言之灵资料索引</h2><span id="libraryCount"></span></div><div class="hero"><h1>不是摘要库，是出处索引库</h1><p>网页直接读取 data/egw-index.json；每条保存书名、章节、定位、相关经文、主题和官方来源。</p></div><div id="libraryList" class="section"></div></section>
<section id="projects" class="panel"><div class="section-head"><h2>讲章项目</h2><span>长期保存 · 可继续</span></div><div class="card"><div class="field"><label>新讲章项目</label><input id="newProjectTitle" placeholder="例如：基督在天上圣所的工作"></div><div class="field"><label>听众</label><select id="newProjectAudience"><option>普通信徒</option><option>初信者</option><option>慕道友</option><option>青年</option><option>儿童</option><option>查经班</option></select></div><div class="field"><label>时长</label><select id="newProjectDuration"><option value="10">10分钟</option><option value="20">20分钟</option><option value="30" selected>30分钟</option><option value="45">45分钟</option></select></div><div class="actions"><button class="primary" onclick="createProject()">建立项目</button></div></div><div id="projectsList" class="section"></div></section>
<section id="basket" class="panel"><div class="section-head"><h2>讲章材料篮</h2><span id="basketCount"></span></div><div class="card"><p>材料保存来源快照和精确出处。只有核对过的预言之灵资料，才建议进入讲章正文。</p></div><div id="basketList" class="section"></div></section>
</div><div id="reader" class="reader"><div class="reader-inner"><div class="readerbar"><button onclick="closeReader()">← 返回</button><button onclick="addCurrent()">＋加入材料篮</button></div><div class="meta" id="rmeta"></div><h1 id="rtitle"></h1><div id="rbody" class="reading"></div><div id="rtools" class="section"></div></div></div><nav class="bottom"><button data-p="home" class="active" onclick="go('home')">首页</button><button data-p="study" onclick="go('study')">圣经→怀著</button><button data-p="library" onclick="go('library')">资料库</button><button data-p="projects" onclick="go('projects')">讲章</button><button data-p="basket" onclick="go('basket')">材料篮</button></nav>
<script>
let egw=[];let relations=[];let sermonSchema=null;let current=null;
const fallbackHierarchy=[{level:1,label:'圣经',rule:'primary'},{level:2,label:'预言之灵原始资料',rule:'supporting_verified_source'},{level:3,label:'我的研究',rule:'user_authored'},{level:4,label:'AI整理',rule:'derived_only_never_quote_as_source'}];
const legacyIdMap={da29:'DA-29-SABBATH',ed29:'ED-29-SABBATH',cch47:'CCH-47-SABBATH','6t44':'6T-44-SABBATH',cihs:'CIHS-2300',ew:'EW-VISIONS',ev8:'EV-08-DISTINCTIVE'};
const bookAliases=[['但以理书','但'],['启示录','启'],['创世记','创'],['出埃及记','出'],['利未记','利'],['希伯来书','来'],['约翰福音','约'],['帖撒罗尼迦前书','帖前'],['哥林多前书','林前'],['马可福音','可'],['以赛亚书','赛']];
function norm(s){let v=String(s||'').trim().replace(/\s+/g,'').replace(/[：]/g,':').toLowerCase();for(const [full,short] of bookAliases)v=v.replaceAll(full,short);v=v.replaceAll('revelation','启').replaceAll('rev','启').replaceAll('daniel','但').replaceAll('dan','但').replaceAll('genesis','创').replaceAll('gen','创').replaceAll('exodus','出').replaceAll('exod','出');return v}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function loadData(){const st=document.getElementById('dataStatus');try{const [e,r,s]=await Promise.all([fetch('./data/egw-index.json',{cache:'no-store'}),fetch('./data/bible-egw-relations.json',{cache:'no-store'}),fetch('./data/sermon-project-schema.json',{cache:'no-store'})]);if(!e.ok||!r.ok||!s.ok)throw new Error('data fetch failed');const [ej,rj,sj]=await Promise.all([e.json(),r.json(),s.json()]);egw=Array.isArray(ej.records)?ej.records:[];relations=Array.isArray(rj.relations)?rj.relations:[];sermonSchema=sj;st.textContent=`资料库 ${egw.length} 条 · 关系 ${relations.length} 条`;st.className='status ok';migrateLegacy();renderHierarchy();renderProjectHome();renderBasket();}catch(err){console.error(err);st.textContent='资料加载失败';st.className='status bad';egw=[];relations=[];sermonSchema={source_hierarchy:fallbackHierarchy};renderHierarchy();renderProjectHome();renderBasket();}}
function renderHierarchy(){const rows=(sermonSchema&&sermonSchema.source_hierarchy)||fallbackHierarchy;document.getElementById('sourceHierarchy').innerHTML=rows.map(x=>`<div class="layer"><b>${esc(x.level)}</b><div><strong>${esc(x.label)}</strong><p class="muted">${esc(x.rule==='primary'?'最高层：经文本身、上下文、相关经文。':x.rule==='supporting_verified_source'?'书名、章节、页/段定位、官方上下文。':x.rule==='user_authored'?'讲道人自己的判断、摘录理由、笔记。':'只能整理已核验资料，不冒充原文。')}</p></div></div>`).join('')}
function relationFor(q){const n=norm(q);if(!n)return null;return relations.find(x=>{const refs=[x.bible_ref,x.normalized,...(x.themes||[])].map(norm);return refs.some(v=>v&&(n.includes(v)||v.includes(n)))})||null}
function relatedEGW(q,rel){const n=norm(q),ids=new Set((rel&&rel.egw_ids)||[]),terms=[q,n,...((rel&&rel.themes)||[]),...((rel&&rel.related_bible)||[])].filter(Boolean).map(norm);return egw.filter(e=>{if(ids.has(e.id))return true;const hay=[e.title_cn,e.title,e.book_code,e.chapter,e.locator,...(e.bible_refs||[]),...(e.topics||[])].map(norm);return terms.some(t=>t&&hay.some(h=>h.includes(t)||t.includes(h)))})}
function go(p){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));if(p==='library')renderLibrary();if(p==='projects')renderProjects();if(p==='basket')renderBasket()}
function quick(q){document.getElementById('homeQ').value=q;runStudy('homeQ')}
function runStudy(id){const q=document.getElementById(id).value.trim();if(!q)return;go('study');document.getElementById('studyQ').value=q;const rel=relationFor(q),hits=relatedEGW(q,rel);let h='';if(rel){h+=`<div class="card"><div class="meta">第一层 · 圣经关系索引</div><h3>${esc(rel.bible_ref)}</h3><div class="source"><b>相关经文</b><br>${(rel.related_bible||[]).map(esc).join(' · ')||'暂无'}</div><div class="chips">${(rel.themes||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div></div>`}else{h+=`<div class="card"><div class="meta">第一层 · 圣经</div><h3>${esc(q)}</h3><p class="muted">当前关系索引没有精确经文节点；继续按主题、书名、出处和经文引用检索预言之灵索引。</p></div>`}h+=`<div class="section-head" style="margin-top:18px"><h2>预言之灵相关原始资料</h2><span>${hits.length} 条结构化出处</span></div>`;if(!hits.length)h+='<div class="empty">当前索引没有精确结果。不会用主题猜测冒充命中。</div>';hits.forEach(e=>h+=egwCard(e));document.getElementById('studyResult').innerHTML=h}
function egwCard(e){return `<div class="result"><div class="meta">第二层 · 预言之灵原始资料定位</div><h3>《${esc(e.title_cn||e.title||'未命名')}》 · ${esc(e.chapter||'')}</h3><div class="source"><b>${esc(e.book_code||'')} · ${esc(e.locator||'')}</b><br>相关经文：${(e.bible_refs||[]).map(esc).join(' · ')||'暂无'}</div><p style="margin-top:9px"><b>经光研究摘要：</b>${esc(String(e.summary||'').replace('研究摘要：',''))}</p><div>${(e.topics||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div><div class="actions"><button class="primary" onclick="openEGW('${esc(e.id)}')">查看出处与上下文</button><button onclick="addBasket('${esc(e.id)}')">＋材料篮</button></div></div>`}
function openEGW(id){const e=egw.find(x=>x.id===id);if(!e)return;current=e;document.getElementById('rmeta').textContent=`预言之灵原始资料定位 · ${e.book_code||''} · ${e.locator||''}`;document.getElementById('rtitle').textContent=`《${e.title_cn||e.title||''}》 ${e.chapter||''}`;document.getElementById('rbody').innerHTML=`<p><b>原始资料层</b></p><p>经光保存精确出处、相关经文和研究摘要。打开官方来源核对完整段落与上下文。</p><p><b>经光研究摘要</b></p><p>${esc(e.summary||'')}</p><p><b>涉及经文</b><br>${(e.bible_refs||[]).map(esc).join(' · ')||'暂无'}</p>`;document.getElementById('rtools').innerHTML=`<div class="card"><div class="meta">核验</div><p>核对顺序：上一段 → 当前段 → 下一段 → 所在章节。</p><div class="actions"><button class="primary" onclick="window.open('${esc(e.source_url||'')}','_blank')">阅读官方原始上下文 ↗</button><button onclick="addBasket('${esc(e.id)}')">＋加入材料篮</button></div></div>`;document.getElementById('reader').style.display='block'}
function closeReader(){document.getElementById('reader').style.display='none'}function addCurrent(){if(current)addBasket(current.id)}
function getBasket(){try{return JSON.parse(localStorage.getItem('jg_v10_basket')||'[]')}catch{return []}}
function migrateLegacy(){const migrated=getBasket().map(x=>typeof x==='string'?(legacyIdMap[x]||x):x);localStorage.setItem('jg_v10_basket',JSON.stringify([...new Set(migrated.map(x=>typeof x==='string'?x:x.source_id).filter(Boolean))]))}
function addBasket(id){const e=egw.find(x=>x.id===id);if(!e)return;const ids=getBasket();if(!ids.includes(id))ids.push(id);localStorage.setItem('jg_v10_basket',JSON.stringify(ids));renderBasket();alert('已加入材料篮')}
function renderBasket(){const ids=getBasket(),records=ids.map(id=>egw.find(x=>x.id===id)).filter(Boolean);document.getElementById('basketCount').textContent=`${records.length} 条`;document.getElementById('basketList').innerHTML=records.length?records.map(e=>`<div class="result basket"><div class="meta">预言之灵 · ${esc(e.book_code||'')} · ${esc(e.locator||'')}</div><h3>《${esc(e.title_cn||e.title||'')}》${esc(e.chapter||'')}</h3><p>${(e.bible_refs||[]).map(esc).join(' · ')}</p><div class="actions"><button onclick="openEGW('${esc(e.id)}')">核对原始出处</button><button onclick="removeBasket('${esc(e.id)}')">移除</button></div></div>`).join(''):'<div class="empty">材料篮还是空的。</div>'}
function removeBasket(id){localStorage.setItem('jg_v10_basket',JSON.stringify(getBasket().filter(x=>x!==id)));renderBasket()}
function getProjects(){try{return JSON.parse(localStorage.getItem('jg_v10_projects')||'[]')}catch{return []}}
function saveProjects(a){localStorage.setItem('jg_v10_projects',JSON.stringify(a));renderProjects();renderProjectHome()}
function normalizeProject(p){if(p.status==='研究中'||!p.status)p.status='researching';if(p.notes!==undefined&&p.research_notes===undefined)p.research_notes=p.notes;if(p.materialIds&& !p.materials)p.materials=p.materialIds.map(id=>snapshotMaterial(id)).filter(Boolean);p.audience=p.audience||'普通信徒';p.duration_minutes=Number(p.duration_minutes||30);p.core_bible_refs=p.core_bible_refs||[];p.outline=p.outline||[];p.application=p.application||'';p.appeal=p.appeal||'';p.research_notes=p.research_notes||'';p.created_at=p.created_at||new Date(p.updated||Date.now()).toISOString();p.updated_at=p.updated_at||new Date(p.updated||Date.now()).toISOString();return p}
function snapshotMaterial(id){const e=egw.find(x=>x.id===id);if(!e)return null;return{id:`mat-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,type:'egw',source_id:e.id,label:`《${e.title_cn||e.title||''}》 ${e.chapter||''}`,locator:e.locator||null,verified:false,note:'',source_url:e.source_url||'',bible_refs:e.bible_refs||[]}}
function createProject(){const t=document.getElementById('newProjectTitle').value.trim();if(!t)return;const now=new Date().toISOString(),a=getProjects();a.unshift({id:`sermon-${Date.now()}`,title:t,status:'researching',audience:document.getElementById('newProjectAudience').value,duration_minutes:Number(document.getElementById('newProjectDuration').value),core_bible_refs:[],materials:[],outline:[],application:'',appeal:'',research_notes:'',created_at:now,updated_at:now});saveProjects(a);document.getElementById('newProjectTitle').value=''}
function statusLabel(s){return({researching:'研究中',outlining:'整理结构',ready:'可讲',archived:'已归档'})[s]||s}
function renderProjects(){const a=getProjects().map(normalizeProject);document.getElementById('projectsList').innerHTML=a.length?a.map(p=>`<div class="result project"><div class="meta">${esc(statusLabel(p.status))} · ${new Date(p.updated_at).toLocaleDateString()}</div><h3>${esc(p.title)}</h3><p>${esc(p.audience)} · ${p.duration_minutes}分钟 · 材料 ${(p.materials||[]).length} 条</p><div class="field"><label>我的研究笔记</label><textarea onchange="updateProject('${esc(p.id)}',this.value)">${esc(p.research_notes||'')}</textarea></div><div class="actions"><button onclick="attachBasket('${esc(p.id)}')">把当前材料篮加入项目</button><button onclick="deleteProject('${esc(p.id)}')">删除</button></div></div>`).join(''):'<div class="empty">还没有讲章项目。</div>'}
function updateProject(id,v){const a=getProjects().map(normalizeProject),p=a.find(x=>String(x.id)===String(id));if(!p)return;p.research_notes=v;p.updated_at=new Date().toISOString();saveProjects(a)}
function attachBasket(id){const a=getProjects().map(normalizeProject),p=a.find(x=>String(x.id)===String(id));if(!p)return;const existing=new Set((p.materials||[]).map(m=>m.source_id));getBasket().forEach(sourceId=>{if(!existing.has(sourceId)){const m=snapshotMaterial(sourceId);if(m)p.materials.push(m)}});p.updated_at=new Date().toISOString();saveProjects(a)}
function deleteProject(id){saveProjects(getProjects().filter(x=>String(x.id)!==String(id)))}
function renderProjectHome(){const a=getProjects().map(normalizeProject);document.getElementById('projectCount').textContent=`${a.length} 个项目`;document.getElementById('projectHome').innerHTML=a.length?a.slice(0,3).map(p=>`<div class="result project"><div class="meta">${esc(statusLabel(p.status))}</div><h3>${esc(p.title)}</h3><p>${(p.materials||[]).length} 条材料 · ${p.research_notes?'已有研究笔记':'尚未写笔记'}</p><div class="actions"><button onclick="go('projects')">继续备讲</button></div></div>`).join(''):'<div class="card"><p>建立第一个讲章项目后，会在这里继续。</p><div class="actions"><button onclick="go('projects')">建立讲章项目</button></div></div>'}
function renderLibrary(){document.getElementById('libraryCount').textContent=`${egw.length} 条`;document.getElementById('libraryList').innerHTML=egw.length?egw.map(e=>egwCard(e)).join(''):'<div class="empty">资料尚未加载。</div>'}
loadData();
</script></body></html>
